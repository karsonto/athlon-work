<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>技能市场</title>
  <style id="skill-hub-theme-tokens"></style>
  <link rel="stylesheet" href="skill-hub.css" />
</head>
<body>
  <div id="app">
    <header class="mast">
      <h1 class="mast-title">技能市场</h1>
      <p class="mast-lede">按分类浏览技能，安装到本地后即可在对话里使用。</p>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M20 20l-3.5-3.5"></path>
        </svg>
        <input id="search" type="search" placeholder="搜索技能名称、分类或说明" autocomplete="off" />
      </div>
      <div id="categoryChips" class="chip-row" role="tablist" aria-label="分类"></div>
      <div class="filter-row">
        <select id="positionFilter" aria-label="岗位">
          <option value="">全部岗位</option>
        </select>
        <select id="sortFilter" aria-label="排序">
          <option value="">默认排序</option>
          <option value="name">按名称</option>
          <option value="category">按分类</option>
        </select>
        <span id="resultCount" class="result-count"></span>
        <button id="manageBtn" type="button" class="text-btn">管理已安装</button>
      </div>
    </header>

    <main id="content" class="content">
      <div id="status" class="status" hidden></div>
      <div id="grid" class="card-grid"></div>
      <nav id="pager" class="pager" hidden aria-label="分页"></nav>
    </main>
  </div>

  <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
  <aside id="drawer" class="drawer" hidden aria-hidden="true" aria-labelledby="drawerTitle">
    <header class="drawer-bar">
      <h2 id="drawerTitle" class="drawer-title">技能详情</h2>
      <button id="drawerClose" type="button" class="icon-btn" aria-label="关闭">×</button>
    </header>
    <div id="drawerBody" class="drawer-body"></div>
  </aside>
  <script src="skill-hub.js"></script>
</body>
</html>
