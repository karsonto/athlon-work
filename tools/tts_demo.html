<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athlon 语音合成系统</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 20px;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6f8; color: #1c1e21;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #16181c; color: #e8eaed; }
    .card { background: #202327 !important; border-color: #33373d !important; }
    input, select, textarea {
      background: #16181c !important; color: #e8eaed !important;
      border-color: #3a3f46 !important;
    }
    .meta { background: #1a1d21 !important; border-color: #33373d !important; }
    .hint { color: #9aa0a6 !important; }
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #6b7280; font-size: 13px; margin-bottom: 20px; }
  .card {
    background: #fff; border: 1px solid #e3e5e8; border-radius: 10px;
    padding: 18px; margin-bottom: 16px;
  }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  textarea, input, select {
    width: 100%; padding: 9px 11px; font-size: 14px; font-family: inherit;
    border: 1px solid #d5d8dc; border-radius: 7px; background: #fff;
  }
  textarea { min-height: 84px; resize: vertical; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 150px; }
  .field { margin-bottom: 14px; }
  button {
    padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
    border: none; border-radius: 7px; background: #1a73e8; color: #fff;
  }
  button:hover:not(:disabled) { background: #1666cf; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.stop { background: #d93025; }
  button.stop:hover:not(:disabled) { background: #b3261c; }
  button.dl { background: #188038; }
  button.dl:hover:not(:disabled) { background: #13732f; }
  .dl-row { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .dl-row .hint { margin-top: 0; }
  a.dl-link {
    display: inline-block; padding: 9px 18px; font-size: 14px; font-weight: 600;
    color: #188038; border: 1px solid #188038; border-radius: 7px;
    text-decoration: none; cursor: pointer;
  }
  a.dl-link:hover { background: rgba(24,128,56,.08); }
  @media (prefers-color-scheme: dark) {
    a.dl-link { color: #81c995; border-color: #81c995; }
    a.dl-link:hover { background: rgba(129,201,149,.1); }
  }
  .meta {
    background: #f8f9fa; border: 1px solid #e3e5e8; border-radius: 7px;
    padding: 11px 13px; font: 12.5px/1.55 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; word-break: break-all;
  }
  .hint { font-size: 12.5px; color: #6b7280; margin-top: 10px; }
  .bar { height: 5px; background: #e3e5e8; border-radius: 3px; overflow: hidden; margin-top: 12px; }
  .bar > i { display: block; height: 100%; width: 0; background: #1a73e8; transition: width .12s; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Athlon 语音合成系统</h1>
  <div class="sub">流式试听 · 模型在本机推理，音频经 SSE 逐块送达</div>

  <div class="card">
    <div class="field">
      <label for="text">合成文本</label>
      <textarea id="text">你好，欢迎使用本地部署的语音合成服务，这是流式试听页面。</textarea>
    </div>

    <div class="row">
      <div class="field">
        <label for="voice">音色</label>
        <select id="voice"></select>
      </div>
      <div class="field">
        <label for="instruct">风格指令（可选）</label>
        <input id="instruct" placeholder="如：用温柔而欢快的语气">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="speed">语速 <span id="speedVal">1.0</span>×</label>
        <input id="speed" type="range" min="0.5" max="2" step="0.1" value="1">
      </div>
      <div class="field">
        <label for="mode">传输方式</label>
        <select id="mode">
          <option value="sse">SSE 事件流（逐块，推荐）</option>
          <option value="http">HTTP chunked（原始 PCM）</option>
        </select>
      </div>
    </div>

    <div class="row" style="align-items:center">
      <button id="go">开始合成</button>
      <button id="stop" class="stop" disabled>停止</button>
      <button id="dl" class="dl">下载 WAV 文件</button>
      <div style="flex:1;min-width:180px">
        <label for="buf">播放缓冲 <span id="bufVal">1.5</span>s
          <span class="hint" style="margin:0 0 0 4px">攒够该时长再出声，吸收卡顿</span></label>
        <input id="buf" type="range" min="0" max="3" step="0.5" value="1.5">
      </div>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div class="hint" id="bufHint" style="margin-top:8px"></div>
    <div class="dl-row" id="dlRow" style="display:none">
      <a class="dl-link" id="dlLink" download>⬇ 下载生成的 WAV</a>
      <span class="hint" id="dlInfo"></span>
    </div>
  </div>

  <div class="card">
    <label>状态</label>
    <div class="meta" id="log">就绪。</div>
    <div class="hint">
      音频先攒够「播放缓冲」时长再开始出声；播放中缓冲耗尽会短暂等待补齐，从而吸收卡顿、保证流畅。
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const logEl = $("log");
let ctx = null, nextTime = 0, active = [], abort = null;
// 预缓冲状态：pendingBuf 保存已到达但未播放的 Float32 块
let pendingBuf = [], pendingDur = 0, bufTarget = 1.5, playing = false;

function log(msg) {
  const t = new Date().toLocaleTimeString("zh-CN", { hour12: false });
  logEl.textContent += `\n[${t}] ${msg}`;
  logEl.scrollTop = logEl.scrollHeight;
}

// 载入可用音色
fetch("/health").then(r => r.json()).then(h => {
  const sel = $("voice");
  sel.innerHTML = "";
  (h.voices || []).forEach(v => {
    const o = document.createElement("option");
    o.value = o.textContent = v;
    sel.appendChild(o);
  });
  log(`服务就绪 · 采样率 ${h.sample_rate}Hz · ffmpeg ${h.ffmpeg ? "可用" : "不可用"}`
      + `\n可用音色 ${h.voices.length} 个`);
}).catch(e => log("无法连接服务：" + e));

$("speed").addEventListener("input", e => $("speedVal").textContent = e.target.value);
$("buf").addEventListener("input", e => {
  bufTarget = parseFloat(e.target.value);
  $("bufVal").textContent = bufTarget.toFixed(1);
});
$("stop").addEventListener("click", () => {
  if (abort) abort.abort();
  stopPlayback();
  setBusy(false);
  log("已停止。");
});

function setBusy(b) {
  $("go").disabled = b;
  $("stop").disabled = !b;
}

function stopPlayback() {
  active.forEach(s => { try { s.stop(); } catch (_) {} });
  active = [];
  nextTime = 0;
  pendingBuf = [];
  pendingDur = 0;
  playing = false;
}

// 把 Int16 PCM 转 Float32 放入待播缓冲
function enqueuePCM(buf, sampleRate) {
  const i16 = new Int16Array(buf);
  if (!i16.length) return;
  const f32 = new Float32Array(i16.length);
  for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;
  pendingBuf.push(f32);
  pendingDur += f32.length / sampleRate;
  // 缓冲不足目标且尚未开播：继续攒
  if (!playing && pendingDur < bufTarget) return;
  if (!playing) {
    playing = true;
    if (bufTarget > 0) log(`缓冲已满（${pendingDur.toFixed(1)}s），开始播放`);
  }
  scheduleFromPending();
}

// 把待播缓冲整体排到 Web Audio 时间轴上（一次调度，内部无缝衔接）
function scheduleFromPending() {
  if (!pendingBuf.length) return;
  if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); }
  if (ctx.state === "suspended") ctx.resume();

  // 合并所有块
  let total = 0;
  for (const b of pendingBuf) total += b.length;
  const merged = new Float32Array(total);
  let off = 0;
  for (const b of pendingBuf) { merged.set(b, off); off += b.length; }
  pendingBuf = [];
  pendingDur = 0;

  const sr = ctx.sampleRate; // createBuffer 必须使用 ctx 的采样率
  let audioBuf;
  if (sr === 24000) {
    audioBuf = ctx.createBuffer(1, merged.length, 24000);
    audioBuf.copyToChannel(merged, 0);
  } else {
    // 简单线性重采样到 ctx 采样率（24000 -> ctx）
    const ratio = sr / 24000;
    const outLen = Math.max(1, Math.floor(merged.length * ratio));
    const out = new Float32Array(outLen);
    for (let i = 0; i < outLen; i++) {
      const p = i / ratio;
      const i0 = Math.min(merged.length - 1, Math.floor(p));
      const i1 = Math.min(merged.length - 1, i0 + 1);
      out[i] = merged[i0] + (merged[i1] - merged[i0]) * (p - i0);
    }
    audioBuf = ctx.createBuffer(1, outLen, sr);
    audioBuf.copyToChannel(out, 0);
  }

  const src = ctx.createBufferSource();
  src.buffer = audioBuf;
  src.connect(ctx.destination);
  const now = ctx.currentTime;
  if (nextTime < now) nextTime = now + 0.05;   // 欠载时留 50ms 余量再续播
  src.start(nextTime);
  nextTime += audioBuf.duration;
  active.push(src);
  src.onended = () => {
    active = active.filter(s => s !== src);
  };
}

// 缓冲余量提示（预缓冲中 / 播放中耗尽预警）
function updateBufHint() {
  const el = $("bufHint");
  if (!playing && bufTarget > 0 && pendingDur < bufTarget) {
    el.textContent = `预缓冲中 ${pendingDur.toFixed(1)}s / ${bufTarget.toFixed(1)}s …`;
    return;
  }
  if (playing && ctx) {
    const remaining = nextTime - ctx.currentTime;
    if (remaining < 0.5 && remaining > -1) {
      el.textContent = "⚠ 缓冲将耗尽，等待下一块音频…";
    } else {
      el.textContent = "";
    }
  }
}

// 定时器持续刷新缓冲提示
setInterval(() => { if (playing || pendingDur > 0) updateBufHint(); }, 250);

async function run() {
  stopPlayback();
  logEl.textContent = "开始…";
  setBusy(true);
  $("prog").style.width = "0%";

  const text = $("text").value.trim();
  if (!text) { log("文本为空。"); setBusy(false); return; }

  const body = {
    input: text,
    voice: $("voice").value,
    speed: parseFloat($("speed").value),
    response_format: "pcm",
  };
  const ins = $("instruct").value.trim();
  if (ins) body.instructions = ins;

  const mode = $("mode").value;
  const url = mode === "sse"
    ? "/v1/audio/speech?protocol=realtime"
    : "/v1/audio/speech?stream=true";

  abort = new AbortController();
  const t0 = performance.now();
  let chunks = 0, bytes = 0, ttfa = null, sseBuf = "";

  try {
    const resp = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
      signal: abort.signal,
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      log(`请求失败 ${resp.status}: ${err.error?.message || resp.statusText}`);
      setBusy(false); return;
    }

    const sr = parseInt(resp.headers.get("X-Sample-Rate") || "24000", 10);
    const reader = resp.body.getReader();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      if (!value || !value.length) continue;

      if (mode === "sse") {
        sseBuf += new TextDecoder().decode(value, { stream: true });
        const lines = sseBuf.split("\n");
        sseBuf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const payload = line.slice(6).trim();
          if (payload === "[DONE]") continue;
          let ev; try { ev = JSON.parse(payload); } catch (_) { continue; }
          if (ev.type === "response.audio.delta") {
            const raw = atob(ev.delta);
            const u8 = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) u8[i] = raw.charCodeAt(i);
            if (ttfa === null) {
              ttfa = performance.now() - t0;
              log(`首块音频 ${ttfa.toFixed(0)}ms 到达`);
            }
            enqueuePCM(u8.buffer, ev.sample_rate || sr);
            chunks++; bytes += u8.length;
            $("prog").style.width =
              Math.min(100, bytes / (sr * 2 * 6) * 100) + "%";
          } else if (ev.type === "error") {
            log("服务端错误：" + (ev.error?.message || "unknown"));
          }
        }
      } else {
        if (ttfa === null) {
          ttfa = performance.now() - t0;
          log(`首块音频 ${ttfa.toFixed(0)}ms 到达`);
        }
        enqueuePCM(value.buffer.slice(value.byteOffset,
                                      value.byteOffset + value.byteLength), sr);
        chunks++; bytes += value.length;
        $("prog").style.width = Math.min(100, bytes / (sr * 2 * 6) * 100) + "%";
      }
    }

    const total = performance.now() - t0;
    $("prog").style.width = "100%";
    const audioSec = (bytes / (sr * 2)).toFixed(2);
    const rtf = (total / 1000 / Math.max(0.01, bytes / (sr * 2))).toFixed(2);
    log(`合成完成 · ${chunks} 块 / ${(bytes/1024).toFixed(0)} KB / ${audioSec}s 音频（RTF ${rtf}）`
        + `\n首块 ${ttfa === null ? "-" : ttfa.toFixed(0) + "ms"} · 总耗时 ${total.toFixed(0)}ms`
        + (rtf > 1 ? `\n提示：RTF>1 表示合成慢于实时，可调大「播放缓冲」或加大服务端 --decode-every` : ""));
    playing = false;
  } catch (e) {
    if (e.name === "AbortError") log("已取消。");
    else log("出错：" + e);
  } finally {
    setBusy(false);
  }
}

$("go").addEventListener("click", run);

// ---- WAV 文件下载 ----
let lastWavUrl = null;

$("dl").addEventListener("click", async () => {
  const btn = $("dl");
  const text = $("text").value.trim();
  if (!text) { log("文本为空，无法下载。"); return; }

  btn.disabled = true;
  btn.textContent = "合成中…";
  log("开始合成 WAV 文件…");

  const body = {
    model: "qwen3-tts",
    input: text,
    voice: $("voice").value,
    speed: parseFloat($("speed").value),
    response_format: "wav",
  };
  const ins = $("instruct").value.trim();
  if (ins) body.instructions = ins;

  try {
    const resp = await fetch("/v1/audio/speech", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      log(`下载失败 ${resp.status}: ${err.error?.message || resp.statusText}`);
      return;
    }
    const blob = await resp.blob();
    // 清理上一次的 blob url
    if (lastWavUrl) URL.revokeObjectURL(lastWavUrl);
    lastWavUrl = URL.createObjectURL(blob);

    const ts = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
    const name = `tts_${$("voice").value}_${ts}.wav`;
    const link = $("dlLink");
    link.href = lastWavUrl;
    link.download = name;
    $("dlInfo").textContent = `${name} · ${(blob.size / 1024).toFixed(0)} KB`;
    $("dlRow").style.display = "flex";
    log(`WAV 已生成 · ${(blob.size / 1024).toFixed(0)} KB · 点击「下载生成的 WAV」保存`);
  } catch (e) {
    log("下载出错：" + e);
  } finally {
    btn.disabled = false;
    btn.textContent = "下载 WAV 文件";
  }
});
</script>
</body>
</html>
