name: Docker Room Sandbox

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
    paths:
      - "docker/athlon-room-sandbox/**"
      - ".github/workflows/docker-room-sandbox.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag to push (optional)"
        required: false
        default: ""

permissions:
  contents: read

env:
  IMAGE_NAME: karsonto/athlon-room-sandbox

jobs:
  build-and-push:
    name: Build And Push
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=2
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker/athlon-room-sandbox
          file: ./docker/athlon-room-sandbox/Dockerfile
          # JDK URL is arch-selected in the Dockerfile; ship both for cloud hosts.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
