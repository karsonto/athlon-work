name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/athlon-web/package-lock.json
            web/athlon-room/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build web SPAs
        shell: pwsh
        run: ./tools/build-web.ps1

      - name: Restore
        run: dotnet restore Athlon.Agent.slnx

      - name: Build Debug
        run: dotnet build Athlon.Agent.slnx --configuration Debug --no-restore

      - name: Build Release
        run: dotnet build Athlon.Agent.slnx --configuration Release --no-restore

      - name: Test Release
        run: dotnet test Athlon.Agent.slnx --configuration Release --no-build --logger "console;verbosity=normal" --blame-hang-timeout 20m --blame-hang-dump-type mini

      - name: Upload Release binaries
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AthlonAgent-Release-${{ github.sha }}
          path: src/Athlon.Agent.App/bin/Release/net10.0-windows10.0.19041.0/
          retention-days: 7
