name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Athlon.Agent.App/Assets/Chat/package-lock.json

      - name: Build chat timeline assets
        working-directory: src/Athlon.Agent.App/Assets/Chat
        run: |
          npm ci
          npm run build
          npm test

      - name: Verify chat-timeline.bundle.js is up to date
        shell: pwsh
        run: |
          git diff --exit-code -- src/Athlon.Agent.App/Assets/Chat/chat-timeline.bundle.js
          if ($LASTEXITCODE -ne 0) {
            Write-Error "chat-timeline.bundle.js is stale. Run 'npm run build' under src/Athlon.Agent.App/Assets/Chat and commit the bundle."
            exit 1
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Athlon.Agent.slnx

      - name: Build Debug
        run: dotnet build Athlon.Agent.slnx --configuration Debug --no-restore

      - name: Build Release
        run: dotnet build Athlon.Agent.slnx --configuration Release --no-restore

      - name: Test Release
        run: dotnet test Athlon.Agent.slnx --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Upload Release binaries
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AthlonAgent-Release-${{ github.sha }}
          path: src/Athlon.Agent.App/bin/Release/net10.0-windows10.0.19041.0/
          retention-days: 7
