openapi: 3.0.3
info:
  title: Athlon Cloud Sandbox Control API
  version: "1.0"
  description: |
    Push-oriented workspace/skills sync:
    - Client sends its desired file manifest.
    - `need` / `needUpload` lists paths the client must upload so staging matches desired.
    - Full `/sync` (tar.gz) and `/sync/delta` both replace staging to match the client payload
      (extras on the server are removed).
servers:
  - url: https://cloud-sandbox.corp.local
paths:
  /v1/status:
    get:
      summary: Control-plane status (ops metrics; quota via enterprise gateway)
      responses:
        "200":
          description: OK
  /v1/regions:
    get:
      summary: List regions
      responses:
        "200":
          description: OK
  /v1/sessions:
    post:
      summary: Create or reuse session (apiKeyId + roomId)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roomId: { type: string }
                imageTag: { type: string }
                region: { type: string }
                networkPolicy: { type: string, enum: [HttpsEgress, VpcOnly] }
      responses:
        "200":
          description: session created
        "503":
          description: cluster capacity exhausted
  /v1/sessions/{id}:
    delete:
      summary: Release session
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: deleted
  /v1/sessions/{id}/sync:
    post:
      summary: Full tar.gz push (workspace|skills); replaces staging contents
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: synced
  /v1/sessions/{id}/sync/manifest:
    post:
      summary: Compare client desired manifest to staging
      description: |
        Request body is a JSON array of `{ path, size, mtimeUnixMs, sha256 }` from the desktop.
        Response `need` / `needUpload` are paths the client must upload next (push, not download).
        Comparison uses sha256 only; mtimeUnixMs is ignored for decisions.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: kind
          schema: { type: string, enum: [workspace, skills], default: workspace }
      responses:
        "200":
          description: paths the client must upload
          content:
            application/json:
              schema:
                type: object
                properties:
                  need:
                    type: array
                    items: { type: string }
                    description: Alias of needUpload (compat)
                  needUpload:
                    type: array
                    items: { type: string }
                    description: Paths the client must upload in /sync/delta
                  currentCount:
                    type: integer
                    description: File count currently on staging
                  remoteCount:
                    type: integer
                    description: Deprecated alias of currentCount
  /v1/sessions/{id}/sync/delta:
    post:
      summary: Apply desired manifest + uploaded blobs (deletes staging extras)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: applied
  /v1/sessions/{id}/sync/pull:
    get:
      summary: Pull workspace tar.gz
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: gzip tar
  /v1/sessions/{id}/exec:
    post:
      summary: Exec command in session
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: exec result
  /v1/sessions/{id}/fs:
    get:
      summary: Read file
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: bytes
    put:
      summary: Write file
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: written
