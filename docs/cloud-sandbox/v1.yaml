openapi: 3.0.3
info:
  title: Athlon Cloud Sandbox Control API
  version: "1.0"
servers:
  - url: https://cloud-sandbox.corp.local
paths:
  /v1/status:
    get:
      summary: Control-plane status (ops metrics; quota via enterprise gateway)
      responses:
        "200":
          description: OK
  /v1/regions:
    get:
      summary: List regions
      responses:
        "200":
          description: OK
  /v1/sessions:
    post:
      summary: Create or reuse session (apiKeyId + roomId)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roomId: { type: string }
                imageTag: { type: string }
                region: { type: string }
                networkPolicy: { type: string, enum: [HttpsEgress, VpcOnly] }
      responses:
        "200":
          description: session created
        "503":
          description: cluster capacity exhausted
  /v1/sessions/{id}:
    delete:
      summary: Release session
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: deleted
  /v1/sessions/{id}/sync:
    post:
      summary: Full tar.gz push (workspace|skills)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: synced
  /v1/sessions/{id}/sync/manifest:
    post:
      summary: Incremental sync — compare manifests
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: list of paths needed
  /v1/sessions/{id}/sync/delta:
    post:
      summary: Incremental sync — upload changed blobs
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: applied
  /v1/sessions/{id}/sync/pull:
    get:
      summary: Pull workspace tar.gz
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: gzip tar
  /v1/sessions/{id}/exec:
    post:
      summary: Exec command in session
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: exec result
  /v1/sessions/{id}/fs:
    get:
      summary: Read file
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: bytes
    put:
      summary: Write file
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: written
